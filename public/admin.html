<!-- লগইন / প্রথমবার পাসওয়ার্ড -->
<div class="login-screen" id="loginScreen" hidden>
  <div class="login-box" id="loginBox">
    <img src="/images/logo-nav.png" alt="শাহিন'স আইসিটি কেয়ার">
    <h1>Admin Panel</h1>
    <p id="loginHint">Log in to continue</p>
    <!-- ধাপ দেখানো: ১ PIN → ২ ইমেইল ও পাসওয়ার্ড (প্রথমবার: সব একসাথে সেটআপ) -->
    <ol class="login-steps" id="loginSteps"><li class="on">PIN</li><li>Email &amp; Password</li></ol>
    <form id="loginForm" novalidate>
      <label data-f="pin">Admin PIN (6 digits)<input class="pin-in" type="password" name="pin" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      <label data-f="pin2" hidden>Confirm PIN<input class="pin-in" type="password" name="pin2" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      <label data-f="email" hidden>Email<input type="email" name="email" autocomplete="username"></label>
      <label data-f="password" hidden>Password<input type="password" name="password" autocomplete="current-password"></label>
      <label data-f="confirm" hidden>Confirm password<input type="password" name="confirm" autocomplete="new-password"></label>
      <p class="err" id="loginErr"></p>
      <button class="btn gold" type="submit" id="loginBtn">Next →</button>
      <button class="login-alt" type="button" id="loginBack" hidden>← Re-enter PIN</button>
    </form>
    <a class="back" href="/">← Back to website</a>
  </div>
</div>
