<div class="login-screen" id="loginScreen" hidden>

    <h1>শিক্ষার্থী প্যানেল</h1>

      <label>শিক্ষার্থী আইডি<input name="id" required placeholder="যেমন: 270001" autocomplete="username" autocapitalize="characters"></label>
      <label>PIN<input name="pin" type="password" inputmode="numeric" required maxlength="10" autocomplete="current-password"></label>
      <p class="err" id="loginErr"></p>
      <button class="btn gold" type="submit">প্রবেশ করুন</button>
    </form>
    <a class="back" href="/">← ওয়েবসাইটে ফিরে যান</a>

  </div>
</div>
